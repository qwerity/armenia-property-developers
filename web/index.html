<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Armenia New Builds Map</title>
  <script>
    // The Google Maps key only allows the "localhost" referrer; 127.0.0.1 gets "Oops! Something went wrong".
    if (location.hostname === "127.0.0.1") location.replace(location.href.replace("//127.0.0.1", "//localhost"));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@85..100,400..700&family=Noto+Sans+Armenian:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar left" id="left">
      <header class="brand">
        <div class="brand-row"><h1>New builds in Armenia</h1><a class="brand-link" href="analytics.html">Analytics</a></div>
        <p id="meta-line" class="muted">Loading…</p>
      </header>

      <div class="search">
        <input id="q" type="search" placeholder="Search projects or any place in Armenia…" autocomplete="off">
      </div>

      <div class="quick" aria-label="Quick filters">
        <label class="qf">Stage<select id="f-status">
          <option value="">Any stage</option>
          <option value="finished">Finished</option>
          <option value="in progress">In progress</option>
          <option value="just started">Just started</option>
          <option value="not started">Not yet started</option>
          <option value="stalled">Stalled / frozen</option>
          <option value="unknown">Unknown</option>
        </select></label>
        <label class="qf">Developer rating<select id="f-grade">
          <option value="">Any rating</option><option value="A">A only</option><option value="B">B or better</option><option value="C">C or better</option>
        </select></label>
        <label class="qf">Region<select id="f-region"><option value="">All regions</option></select></label>
        <label class="qf">Max $/m²<input id="f-pmax" type="number" min="0" step="50" placeholder="Any" inputmode="numeric"></label>
      </div>
      <div class="chips-bar" id="active-chips" hidden></div>

      <details class="filters" id="more-filters">
        <summary><span>More filters</span> <span id="active-filters" class="pill" hidden></span></summary>
        <div class="fgroup">
          <h4>Location</h4>
          <div class="grid2">
            <label>District<select id="f-district"><option value="">All districts</option></select></label>
            <label>Source<select id="f-source"><option value="">All sources</option></select></label>
            <label class="span2">Developer<select id="f-dev"><option value="">All developers</option></select></label>
          </div>
          <div class="checks">
            <label><input id="f-view" type="checkbox"> Only in map view</label>
            <label><input id="f-precise" type="checkbox"> Precise location only</label>
          </div>
        </div>
        <div class="fgroup">
          <h4>Price</h4>
          <div class="grid2">
            <label>Min $/m²<input id="f-pmin" type="number" min="0" step="50" placeholder="Any" inputmode="numeric"></label>
            <label>Apartments from, up to $<input id="f-budget" type="number" min="0" step="5000" placeholder="e.g. 90000" inputmode="numeric"></label>
          </div>
          <div class="checks">
            <label><input id="f-deal" type="checkbox"> Below local median</label>
            <label><input id="f-priced" type="checkbox"> Has price</label>
            <label><input id="f-tax" type="checkbox"> Income-tax refund</label>
          </div>
        </div>
        <div class="fgroup">
          <h4>Project</h4>
          <div class="grid2">
            <label>Type<select id="f-kind"><option value="">Any</option></select></label>
            <label>Ready by<select id="f-year"><option value="">Any</option></select></label>
            <label>Info completeness<select id="f-info">
              <option value="">Any</option><option value="70">70% or more</option><option value="80">80% or more</option><option value="90">90% or more</option>
            </select></label>
          </div>
          <div class="checks">
            <label><input id="f-hidesold" type="checkbox"> Hide sold out</label>
            <label><input id="f-clean" type="checkbox"> No legal red flags</label>
          </div>
        </div>
      </details>

      <div class="listbar">
        <span id="count" class="count"></span>
        <button id="reset" class="link" type="button">Clear all</button>
        <label class="sort"><span class="sr-only">Sort by</span>
          <select id="sort">
            <option value="deal">Best deal</option>
            <option value="ppm">Lowest $/m²</option>
            <option value="from">Cheapest apartment</option>
            <option value="soon">Ready soonest</option>
            <option value="rep">Best developer</option>
            <option value="info">Most complete info</option>
            <option value="pop">Most viewed</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
        <div class="seg" id="currency" aria-label="Currency">
          <button data-cur="USD" class="on" type="button">$</button><button data-cur="AMD" type="button">֏</button>
        </div>
      </div>
      <ul id="list" class="list" role="listbox" aria-label="Projects"></ul>
    </aside>

    <main class="mapwrap">
      <div id="map"></div>
      <button id="toggle-left" class="fab left-fab" aria-label="Toggle project list">☰</button>
      <div class="zoomlvl" id="zoomlvl" title="Map zoom level" aria-live="polite">Zoom —</div>
      <div class="seg basemap" id="viewmode">
        <button data-mode="2d" class="on" title="Street map">2D</button><button data-mode="3d" title="Street map with 3D buildings">3D</button><button data-mode="photo" title="Photorealistic 3D (hybrid)">Photo 3D</button>
      </div>
      <div class="ctrl3d" id="ctrl3d" hidden>
        <button data-cam="zoom-in" title="Zoom in">＋</button>
        <button data-cam="zoom-out" title="Zoom out">−</button>
        <button data-cam="rotate-left" title="Rotate left">⟲</button>
        <button data-cam="rotate-right" title="Rotate right">⟳</button>
        <button data-cam="tilt-up" title="Tilt up">⤒</button>
        <button data-cam="tilt-down" title="Tilt down">⤓</button>
        <button data-cam="north" title="Reset north">N</button>
        <button data-cam="orbit" title="Orbit around (click again to stop)" aria-pressed="false">◎</button>
      </div>
      <div class="legend collapsed" id="legend">
        <button class="legend-head" id="legend-toggle" type="button" aria-expanded="false"><strong>Developers</strong><span class="chev" aria-hidden="true"></span></button>
        <ul id="legend-list"></ul>
      </div>
    </main>

    <aside class="sidebar right" id="right" hidden>
      <button id="close-right" class="close" aria-label="Close details">×</button>
      <div id="details"></div>
    </aside>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="close" aria-label="Close image">×</button>
    <button class="nav prev" aria-label="Previous image">‹</button>
    <img alt="" referrerpolicy="no-referrer">
    <button class="nav next" aria-label="Next image">›</button>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
