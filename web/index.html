<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Armenia New Builds Map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar left" id="left">
      <header class="brand">
        <h1>Armenia New Builds</h1>
        <p id="meta-line" class="muted">Loading…</p>
      </header>

      <div class="search">
        <input id="q" type="search" placeholder="Search project, developer, district…" autocomplete="off">
      </div>

      <details class="filters" open>
        <summary>Filters <span id="active-filters" class="pill" hidden></span></summary>
        <div class="grid2">
          <label>Region<select id="f-region"><option value="">All regions</option></select></label>
          <label>District<select id="f-district"><option value="">All districts</option></select></label>
          <label class="span2">Developer<select id="f-dev"><option value="">All developers</option></select></label>
          <label>Type<select id="f-kind"><option value="">Any</option></select></label>
          <label>Construction stage<select id="f-status">
            <option value="">Any stage</option>
            <option value="finished">Finished</option>
            <option value="in progress">In progress</option>
            <option value="just started">Just started</option>
            <option value="not started">Not yet started</option>
            <option value="stalled">Stalled / frozen</option>
            <option value="unknown">Unknown</option>
          </select></label>
          <label>$/m² from<input id="f-pmin" type="number" min="0" step="50" placeholder="min"></label>
          <label>$/m² to<input id="f-pmax" type="number" min="0" step="50" placeholder="max"></label>
          <label>Budget, apt. from ≤ $<input id="f-budget" type="number" min="0" step="5000" placeholder="e.g. 90000"></label>
          <label>Ready by (year)<select id="f-year"><option value="">Any</option></select></label>
          <label>Info completeness<select id="f-info">
            <option value="">Any</option><option value="70">≥ 70%</option><option value="80">≥ 80%</option><option value="90">≥ 90%</option>
          </select></label>
          <label>Developer rating<select id="f-grade">
            <option value="">Any</option><option value="A">A only</option><option value="B">B or better</option><option value="C">C or better</option>
          </select></label>
          <label>Source<select id="f-source"><option value="">All sources</option></select></label>
        </div>
        <div class="checks">
          <label><input id="f-deal" type="checkbox"> Below local median $/m²</label>
          <label><input id="f-priced" type="checkbox"> Has price</label>
          <label><input id="f-tax" type="checkbox"> Income-tax refund eligible</label>
          <label><input id="f-view" type="checkbox"> Only in map view</label>
          <label><input id="f-hidesold" type="checkbox"> Hide sold out</label>
          <label><input id="f-precise" type="checkbox"> Precise location only</label>
          <label><input id="f-clean" type="checkbox"> No legal red flags</label>
        </div>
        <div class="row between">
          <button id="reset" class="link">Reset filters</button>
          <div class="seg" id="currency">
            <button data-cur="USD" class="on">USD</button><button data-cur="AMD">AMD</button>
          </div>
        </div>
      </details>

      <div class="row between listbar">
        <span id="count" class="muted"></span>
        <label class="sort">Sort
          <select id="sort">
            <option value="deal">Best deal vs. local median</option>
            <option value="ppm">Lowest $/m²</option>
            <option value="from">Cheapest apartment</option>
            <option value="soon">Completion (soonest)</option>
            <option value="pop">Most viewed</option>
            <option value="info">Most complete info</option>
            <option value="rep">Best developer rating</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
      </div>
      <ul id="list" class="list" role="listbox" aria-label="Projects"></ul>
    </aside>

    <main class="mapwrap">
      <div id="map"></div>
      <button id="toggle-left" class="fab left-fab" aria-label="Toggle project list">☰</button>
      <div class="seg basemap" id="basemap">
        <button data-style="streets">Streets</button><button data-style="satellite">Satellite</button><button data-style="hybrid" class="on">Hybrid</button>
      </div>
      <div class="legend" id="legend">
        <div class="legend-head"><strong>Developers</strong><button id="legend-toggle" class="link">hide</button></div>
        <ul id="legend-list"></ul>
      </div>
    </main>

    <aside class="sidebar right" id="right" hidden>
      <button id="close-right" class="close" aria-label="Close details">×</button>
      <div id="details"></div>
    </aside>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="close" aria-label="Close image">×</button>
    <button class="nav prev" aria-label="Previous image">‹</button>
    <img alt="" referrerpolicy="no-referrer">
    <button class="nav next" aria-label="Next image">›</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
